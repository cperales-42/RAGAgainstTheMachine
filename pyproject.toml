[project]
name = "rag"
version = "0.1.0"
description = "Retrieval-Augmented Generation pipeline over the vLLM codebase"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.0",
    "numpy>=1.26",
    "pydantic>=2.0",
    "torch>=2.0",
    "tqdm>=4.66",
    "transformers>=4.40",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "types-tqdm>=4.70.0.20260906",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
exclude = "(data|datasets_public|\\.venv|build|dist)/"

[[tool.mypy.overrides]]
module = ["fire"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
